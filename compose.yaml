# Pulls the published image rather than building from source. Fine for
# getting it running and poking around; once you start editing code, you'll
# want to build locally instead (ask and I'll wire that up).
#
# Four services, not two, because two of them are invisible plumbing rather
# than things you'll ever look at:
#   - secrets-init: runs once, writes a generated password/secret file, exits.
#   - worker: does the actual mail syncing (IMAP, queues, scheduler). Without
#     it the server comes up but no mail ever arrives.
# php (the server) and database are the two you'll actually interact with.
#
# Everything is bind-mounted under /mnt/cache/appdata/pimail/ instead of
# named Docker volumes, so every piece of state is a real, visible path on
# the NAS rather than something buried in Docker's own volume store.
x-app-image: &app-image ghcr.io/nimaste/pimail:latest

services:
  secrets-init:
    image: *app-image
    restart: "no"
    entrypoint: ["generate-secrets"]
    volumes:
      - /mnt/cache/appdata/pimail/secrets:/app/var/secrets

  php:
    image: *app-image
    restart: unless-stopped
    environment:
      APP_ENV: prod
      SERVER_NAME: ${SERVER_NAME:-localhost, :443}, php:80
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: https://localhost/.well-known/mercure
    volumes:
      - /mnt/cache/appdata/pimail/caddy/data:/data
      - /mnt/cache/appdata/pimail/caddy/config:/config
      - /mnt/cache/appdata/pimail/secrets:/app/var/secrets
      - /mnt/cache/appdata/pimail/attachments:/app/var/attachments
      - /mnt/cache/appdata/pimail/raw:/app/var/raw
      - /mnt/cache/appdata/pimail/uploads:/app/var/uploads
    ports:
      - "8025:80"
      - "8443:443"
      - "8443:443/udp"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy

  worker:
    image: *app-image
    restart: unless-stopped
    command: php bin/console app:work
    init: true
    environment:
      APP_ENV: prod
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: https://localhost/.well-known/mercure
    networks:
      default:
        aliases: [mercure]
    volumes:
      - /mnt/cache/appdata/pimail/mercure/data:/data
      - /mnt/cache/appdata/pimail/mercure/config:/config
      - /mnt/cache/appdata/pimail/secrets:/app/var/secrets
      - /mnt/cache/appdata/pimail/attachments:/app/var/attachments
      - /mnt/cache/appdata/pimail/raw:/app/var/raw
      - /mnt/cache/appdata/pimail/uploads:/app/var/uploads
    healthcheck:
      disable: true
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/plmail/postgres_password
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      interval: 5s
      retries: 30
      start_period: 60s
    volumes:
      - /mnt/cache/appdata/pimail/database:/var/lib/postgresql
      - /mnt/cache/appdata/pimail/secrets:/run/plmail:ro
